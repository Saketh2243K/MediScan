name: Build Mediketh Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Enable camera permission for barcode scanning
        run: node scripts/enable-android-camera.mjs
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mediketh-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="apk-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" android/app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Mediketh Android APK (build ${GITHUB_RUN_NUMBER})" \
            --notes "Debug APK built from commit ${GITHUB_SHA}." \
            --latest
